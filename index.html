<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SR BRM Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d84315">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SR BRM">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <img class="logo" src="assets/logo.png" alt="Secunderabad Randonneurs logo">
      <div class="brand">
        <h1>Secunderabad Randonneurs</h1>
        <p>Rides, riders and results in one place</p>
      </div>
      <nav class="links" aria-label="Audax India links">
        <a href="https://www.audaxindia.in/eventsv2.php" target="_blank" rel="noopener">Audax calendar</a>
        <a href="https://www.audaxindia.in/member-login.php" target="_blank" rel="noopener">Rider login</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="tiles" class="navwrap" aria-label="Sections"></section>

    <section id="detail" class="detail" aria-live="polite">
      <p class="note">Loading events…</p>
    </section>
  </main>

  <footer class="foot">
    <p>Rider data is read from <a href="https://www.audaxindia.in" target="_blank" rel="noopener">audaxindia.in</a> and refreshes every 5 minutes. Registration and payment are done only on the Audax India website.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=24"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));</script>
</body>
</html>
